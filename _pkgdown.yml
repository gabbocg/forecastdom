url: https://gabbocg.github.io/forecastdom/
template:
  bootstrap: 5
  bootswatch: default
  bslib:
    base_font: {google: "Source Sans Pro"}
    heading_font: {google: "Source Sans Pro"}
    font-size-base: 0.9375rem
    bg: '#ffffff'
    fg: '#1B2A3D'
    primary: '#47A5C5'
    link-color: '#47A5C5'
    navbar-bg: '#47A5C5'
    navbar-fg: '#ffffff'
    navbar-brand-color: '#ffffff'
    code-bg: '#f0f6fa'
    border-color: '#47A5C5'
navbar:
  structure:
    left:
    - intro
    - reference
    - articles
    right:
    - search
    - github
  components:
    articles:
      text: Articles
      menu:
      - text: Replicating Rossi (2006)
        href: articles/rossi2006-dm.html
      - text: Replicating Rapach & Zhou (2013)
        href: articles/rz2013-cw-macro.html
      - text: Replicating Neely et al. (2014)
        href: articles/nrtz2014-cw-technical.html
      - text: Replicating Rapach et al. (2016)
        href: articles/rrz2016-ivx-qll.html
      - text: Replicating Quaedvlieg (2021)
        href: articles/quaedvlieg2021-mh-spa.html
reference:
- title: Forecast Comparison Tests
  desc: |
    Pairwise and multivariate tests for comparing the predictive ability of forecasting methods.
  contents:
  - dm_test
  - cw_test
  - enc_new
  - gw_test
- title: Superior Predictive Ability
  desc: |
    Tests for whether a benchmark method dominates all competitors,
    unconditionally, conditionally, or jointly across forecast horizons.
  contents:
  - spa_test
  - cspa_test
  - csms
  - uspa_mh_test
  - aspa_mh_test
- title: Predictive Regression & Instability
  desc: |
    Tests for predictability with persistent regressors and parameter instability.
  contents:
  - ivx_wald
  - qll_hat
- title: Visualization
  desc: Plotting tools for CSPA test results.
  contents: cspa_test_plot
- title: Simulation
  desc: Data generating process from Li, Liao, and Quaedvlieg (2022).
  contents: do_sim
- title: Print & Summary Methods
  contents:
  - print.cspa_test
  - summary.cspa_test
- title: Datasets
  desc: Datasets bundled with the package.
  contents:
  - rossi2006
  - rz2013
  - nrtz2014
  - rrz2016
  - quaedvlieg2021
footer:
  structure:
    left: developed_by
    right: built_with

